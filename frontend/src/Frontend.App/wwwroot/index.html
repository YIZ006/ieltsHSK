    <script>
        // Điều phối tiến trình tải mượt mà: Chạy thoăn thoắt -> Bật nhảy rướn cao -> Tiếp đất nén lực -> Fade-out êm ái
        (function () {
            const loader = document.getElementById('app-loader');
            const fill = document.getElementById('pet-fill');
            const runnerWrapper = document.getElementById('pet-runner-wrapper');
            const runner = document.getElementById('pet-runner');
            const percentText = document.getElementById('pet-percent');

            let currentProgress = 0;
            let targetProgress = 0;
            let blazorReady = false;
            let isJumping = false;
            let isComplete = false;

            function updateUI(p) {
                const rounded = Math.min(100, Math.round(p));
                fill.style.width = p + '%';
                runnerWrapper.style.left = p + '%';
                percentText.textContent = rounded + '%';

                // Khi tiến độ >= 75%: Pet chuyển sang rướn người và bật vọt lên đỉnh
                if (p >= 75 && !isJumping) {
                    isJumping = true;
                    runner.classList.add('jumping');
                } else if (p < 75 && isJumping) {
                    isJumping = false;
                    runner.classList.remove('jumping');
                }

                // Khi chạm 100%: Chờ tiếp đất 300ms rồi fade-out êm ái
                if (p >= 99.5 && !isComplete) {
                    isComplete = true;
                    setTimeout(() => {
                        loader.classList.add('fade-out');
                        setTimeout(() => {
                            loader.style.display = 'none';
                        }, 500);
                    }, 300);
                }
            }

            // Vòng lặp animation 60FPS nội suy mượt mà
            function tick() {
                if (!isComplete) {
                    const diff = targetProgress - currentProgress;
                    if (diff > 0) {
                        const step = Math.max(0.4, diff * 0.1);
                        currentProgress = Math.min(targetProgress, currentProgress + step);
                        updateUI(currentProgress);
                    }
                    requestAnimationFrame(tick);
                }
            }
            requestAnimationFrame(tick);

            // Giả lập tiến trình lướt êm ái ban đầu
            targetProgress = 35;
            setTimeout(() => { if (!blazorReady) targetProgress = Math.max(targetProgress, 65); }, 250);
            setTimeout(() => { if (!blazorReady) targetProgress = Math.max(targetProgress, 85); }, 600);
            setTimeout(() => { if (!blazorReady) targetProgress = Math.max(targetProgress, 92); }, 1200);
            setTimeout(() => { if (!blazorReady) targetProgress = Math.max(targetProgress, 97); }, 2500);

            // Safety Fallback: Tự động mở màn hình sau 4.5s để không bao giờ bị đứng
            setTimeout(() => {
                blazorReady = true;
                targetProgress = 100;
            }, 4500);

            function startBlazor() {
                if (window.Blazor && !window._blazorStarted) {
                    window._blazorStarted = true;
                    Blazor.start().then(() => {
                        blazorReady = true;
                        targetProgress = 100;
                    }).catch(err => {
                        console.warn("Blazor boot notice:", err);
                        blazorReady = true;
                        targetProgress = 100;
                    });
                }
            }

            if (window.Blazor) {
                startBlazor();
            } else {
                window.addEventListener('DOMContentLoaded', startBlazor);
                window.addEventListener('load', startBlazor);
            }
        })();
    </script>

        window.scrollToElementId = function (elementId) {
            try {
                var element = document.getElementById(elementId);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            } catch (err) {
                console.error("Error scrolling:", err);
            }
        };

        // Bind Listening Inputs
        window.bindListeningInputs = function (dotNetHelper) {
            document.querySelectorAll('.ielts-input').forEach(input => {
                if (!input.dataset.bound) {
                    input.dataset.bound = "true";
                    input.addEventListener('input', function (e) {
                        const qId = parseInt(e.target.dataset.q);
                        const val = e.target.value;
                        if (qId) {
                            dotNetHelper.invokeMethodAsync('OnHtmlInputChange', qId, val);
                        }
                    });
                }
            });
        };

    <script>
        window.scrollBuilderToTop = () => {
            const el = document.getElementById('builder-main');
            if (el) el.scrollTop = 0;
            else window.scrollTo(0, 0);
        };

        // Web Speech API for Story Reading and Vocabulary pronunciation
        window.speakText = function (text, lang = 'en-US', rate = 0.95) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = rate;
            window.speechSynthesis.speak(utterance);
        };
        window.stopSpeakText = function () {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        };

        // Auto-focus game input (dùng cho HskVocabShooter popup)
        // Gọi từ OnAfterRenderAsync sau khi <input> đã được render vào DOM
        window.focusGameInput = function (inputElement) {
            if (!inputElement) return;
            try {
                // .focus() để nhận keyboard trên desktop
                inputElement.focus({ preventScroll: true });
                // Đặt cursor vào cuối chuỗi (nếu có text)
                const len = inputElement.value ? inputElement.value.length : 0;
                inputElement.setSelectionRange(len, len);
            } catch (e) {
                // Fallback nếu element ref không hợp lệ
                console.warn('[focusGameInput] focus failed:', e);
            }
        };

        // ─── Quantum Briefcase Animation & VFX Helpers ───
        window.initQuantumBriefcase = function () {
            const coreImg = document.getElementById('quantumCoreSpark');
            if (!coreImg || window._quantumCoreInterval) return;
            let frame = 1;
            window._quantumCoreInterval = setInterval(function () {
                const el = document.getElementById('quantumCoreSpark');
                if (!el) {
                    clearInterval(window._quantumCoreInterval);
                    window._quantumCoreInterval = null;
                    return;
                }
                frame = (frame % 6) + 1;
                el.src = 'images/games/quantum-cipher/set/set' + frame + '_trans.png';
            }, 85);
        };

        window.triggerBatteryZap = function (rodIndex) {
            try { window.WordleSfx && window.WordleSfx.electricZap && window.WordleSfx.electricZap(); } catch(e){}
            const burst = document.getElementById('quantumSparkBurst');
            const img = document.getElementById('quantumSparkBurstImg');
            const tray = document.getElementById('quantumBatteryTray');
            if (!burst || !img || !tray) return;
            const rods = tray.querySelectorAll('.power-rod');
            if (!rods || !rods[rodIndex]) return;
            const rect = rods[rodIndex].getBoundingClientRect();
            const stage = document.getElementById('quantumStageBox');
            if (!stage) return;
            const stageRect = stage.getBoundingClientRect();
            const leftPct = ((rect.left + rect.width / 2 - stageRect.left) / stageRect.width) * 100;
            const topPct = ((rect.top + rect.height / 2 - stageRect.top) / stageRect.height) * 100;
            burst.style.left = leftPct + '%';
            burst.style.top = topPct + '%';
            burst.style.display = 'block';
            let frame = 1;
            const iv = setInterval(function () {
                frame++;
                if (frame <= 6) {
                    img.src = 'images/games/quantum-cipher/setgiat/setgiat' + frame + '_trans.png';
                } else {
                    clearInterval(iv);
                    burst.style.display = 'none';
                }
            }, 45);
        };

        // ─── Quantum Briefcase Interactive Spotlight Tutorial & Typewriter System ───
        window.QuantumTutorial = (function () {
            let _dotNetRef = null;
            let currentTutorialStep = 0;
            let typewriterTimer = null;
            let isTyping = false;
            let currentFullText = '';
            let _keyHandlerBound = false;

            const TUTORIAL_STEPS = [
                {
                    targetSelector: '.phone-dock-left',
                    title: '1. MẬT THƯ TÌNH BÁO // DOSSIER',
                    text: 'Điện thoại tác chiến cánh trái hiển thị dữ liệu mật: cấp độ từ, nghĩa tiếng Việt và ngữ cảnh câu ví dụ. Dùng các nút bên dưới để [Mở chữ đầu], [Phát âm], hoặc [Đổi từ mới].',
                    cardPosition: 'right-center',
                    fallbackBox: { left: '3.5%', top: '12%', width: '25%', height: '80%' }
                },
                {
                    targetSelector: '.plasma-reactor-spark, #hudTimer',
                    title: '2. ĐẾM NGƯỢC & LÕI PLASMA',
                    text: 'Lõi phản ứng plasma và đồng hồ đếm ngược 120 giây. Khi còn 30s bom sẽ hú còi báo động to; dưới 20s và 10s nhịp đếm sẽ dồn dập khẩn cấp. Hãy gỡ bom trước khi đồng hồ về 00:00!',
                    cardPosition: 'bottom-center',
                    fallbackBox: { left: '29%', top: '18%', width: '42%', height: '36%' }
                },
                {
                    targetSelector: '#rowLockedSlots, #plateRow2',
                    title: '3. ĐĨA CHỐT & ĐĨA NHẬP MẬT MÃ',
                    text: 'Hàng 1 [CHỐT]: Cố định màu xanh các chữ cái bạn đã giải mã đúng vị trí. Hàng 2 [NHẬP]: Nơi nhập các ký tự bạn đoán cho lượt hiện tại. Hỗ trợ tự co giãn từ 4 đến 8 chữ!',
                    cardPosition: 'top-center',
                    fallbackBox: { left: '28.5%', top: '58%', width: '43%', height: '38%' }
                },
                {
                    targetSelector: '#quantumBatteryTray',
                    title: '4. 6 THỎI PIN NĂNG LƯỢNG // 6 MẠNG',
                    text: 'Mỗi viên pin mang biểu tượng tia sét đại diện cho 1 lượt thử. Khi đoán sai 1 từ, 1 viên pin sẽ phát nổ chập điện xè xè và ngắt mạch. Hết 6 pin thì kíp nổ sẽ kích hoạt!',
                    cardPosition: 'left-bottom',
                    fallbackBox: { left: '74%', top: '12%', width: '22%', height: '16%' }
                },
                {
                    targetSelector: '#keyboardContainer',
                    title: '5. BÀN PHÍM CƠ & ĐIỀU KHIỂN',
                    text: 'Bấm phím ảo trên màn hình hoặc GÕ TRỰC TIẾP TỪ BÀN PHÍM MÁY TÍNH (A-Z, Backspace, Enter). Sau khi nộp, phím đổi màu Xanh (đúng), Vàng (sai vị trí), Đen (không có) chuẩn Wordle.',
                    cardPosition: 'left-center',
                    fallbackBox: { left: '73%', top: '48%', width: '24%', height: '48%' }
                }
            ];

            function start(dotNetRef) {
                _dotNetRef = dotNetRef;
                function tryInit(attempt) {
                    const overlay = document.getElementById('tutorialOverlay');
                    const stage = document.getElementById('quantumStageBox');
                    if (!overlay || !stage) {
                        if (attempt < 12) {
                            setTimeout(function () { tryInit(attempt + 1); }, 60);
                        }
                        return;
                    }
                    overlay.classList.add('show');
                    currentTutorialStep = 0;
                    bindControls();
                    renderStep(currentTutorialStep);
                }
                tryInit(0);
            }

            function end() {
                try {
                    clearInterval(typewriterTimer);
                    const overlay = document.getElementById('tutorialOverlay');
                    if (overlay) overlay.classList.remove('show');
                    if (_dotNetRef) {
                        _dotNetRef.invokeMethodAsync('OnQuantumTutorialFinished');
                    }
                } catch (e) { }
            }

            function renderStep(stepIndex) {
                try {
                    clearInterval(typewriterTimer);
                    const step = TUTORIAL_STEPS[stepIndex];
                    if (!step) {
                        end();
                        return;
                    }

                    const overlay = document.getElementById('tutorialOverlay');
                    const box = document.getElementById('tutorialSpotlightBox');
                    const card = document.getElementById('tutorialCard');
                    const tutStepText = document.getElementById('tutStepText');
                    const tutStepDots = document.getElementById('tutStepDots');
                    const tutTitle = document.getElementById('tutTitle');
                    const tutBodyText = document.getElementById('tutBodyText');
                    const tutCursor = document.getElementById('tutCursor');
                    const tutNextBtnText = document.getElementById('tutNextBtnText');

                    if (!overlay || !box || !card) return;

                    if (tutStepText) tutStepText.textContent = `BƯỚC ${stepIndex + 1}/${TUTORIAL_STEPS.length}`;
                    if (tutStepDots) {
                        const dots = tutStepDots.querySelectorAll('.tut-dot');
                        dots.forEach((d, i) => d.classList.toggle('active', i === stepIndex));
                    }

                    if (tutTitle) tutTitle.textContent = step.title;
                    if (tutNextBtnText) tutNextBtnText.textContent = (stepIndex === TUTORIAL_STEPS.length - 1) ? 'VÀO CHƠI' : 'TIẾP THEO';

                    // 1. Calculate Spotlight Box Coordinates
                    let positioned = false;
                    const stage = document.getElementById('quantumStageBox');
                    if (stage) {
                        const stageRect = stage.getBoundingClientRect();
                        if (stageRect.width > 0 && stageRect.height > 0) {
                            let targets = stage.querySelectorAll(step.targetSelector);
                            if (targets.length > 0) {
                                let minL = Infinity, minT = Infinity, maxR = -Infinity, maxB = -Infinity;
                                targets.forEach(t => {
                                    const r = t.getBoundingClientRect();
                                    if (r.left < minL) minL = r.left;
                                    if (r.top < minT) minT = r.top;
                                    if (r.right > maxR) maxR = r.right;
                                    if (r.bottom > maxB) maxB = r.bottom;
                                });

                                if (minL < maxR && minT < maxB) {
                                    const pad = 6;
                                    const spotLeft = ((minL - stageRect.left - pad) / stageRect.width) * 100;
                                    const spotTop = ((minT - stageRect.top - pad) / stageRect.height) * 100;
                                    const spotWidth = ((maxR - minL + pad * 2) / stageRect.width) * 100;
                                    const spotHeight = ((maxB - minT + pad * 2) / stageRect.height) * 100;

                                    box.style.left = spotLeft + '%';
                                    box.style.top = spotTop + '%';
                                    box.style.width = spotWidth + '%';
                                    box.style.height = spotHeight + '%';
                                    positioned = true;
                                }
                            }
                        }
                    }

                    // Fallback to responsive predefined coordinates if DOM rect calculation failed
                    if (!positioned && step.fallbackBox) {
                        box.style.left = step.fallbackBox.left;
                        box.style.top = step.fallbackBox.top;
                        box.style.width = step.fallbackBox.width;
                        box.style.height = step.fallbackBox.height;
                    }

                    // 2. Position Briefing Card to not obstruct the target
                    if (step.cardPosition === 'right-center') {
                        card.style.left = '42%';
                        card.style.top = '25%';
                    } else if (step.cardPosition === 'bottom-center') {
                        card.style.left = '32%';
                        card.style.top = '54%';
                    } else if (step.cardPosition === 'top-center') {
                        card.style.left = '32%';
                        card.style.top = '12%';
                    } else if (step.cardPosition === 'left-bottom') {
                        card.style.left = '38%';
                        card.style.top = '18%';
                    } else {
                        card.style.left = '36%';
                        card.style.top = '35%';
                    }

                    // 3. Typewriter text animation
                    currentFullText = step.text;
                    if (tutBodyText) tutBodyText.textContent = '';
                    if (tutCursor) tutCursor.style.display = 'inline-block';
                    isTyping = true;
                    let charIdx = 0;

                    typewriterTimer = setInterval(function () {
                        if (charIdx < currentFullText.length) {
                            if (tutBodyText) tutBodyText.textContent += currentFullText[charIdx];
                            try {
                                if (charIdx % 3 === 0 && window.WordleSfx && window.WordleSfx.keyClick) {
                                    window.WordleSfx.keyClick();
                                }
                            } catch (e) { }
                            charIdx++;
                        } else {
                            clearInterval(typewriterTimer);
                            isTyping = false;
                            if (tutCursor) tutCursor.style.display = 'none';
                        }
                    }, 20);
                } catch (e) {
                    console.error('[QuantumTutorial.renderStep error]', e);
                }
            }

            function completeTypewriterImmediately() {
                if (isTyping) {
                    clearInterval(typewriterTimer);
                    const tutBodyText = document.getElementById('tutBodyText');
                    const tutCursor = document.getElementById('tutCursor');
                    if (tutBodyText) tutBodyText.textContent = currentFullText;
                    isTyping = false;
                    if (tutCursor) tutCursor.style.display = 'none';
                    return true;
                }
                return false;
            }

            function advanceStep() {
                if (completeTypewriterImmediately()) {
                    // Instantly revealed full text
                } else {
                    if (currentTutorialStep < TUTORIAL_STEPS.length - 1) {
                        currentTutorialStep++;
                        renderStep(currentTutorialStep);
                    } else {
                        end();
                    }
                }
            }

            function bindControls() {
                const card = document.getElementById('tutorialCard');
                const btnTutNext = document.getElementById('btnTutNext');
                const btnTutSkip = document.getElementById('btnTutSkip');

                if (card && !card.dataset.bound) {
                    card.dataset.bound = 'true';
                    card.addEventListener('click', function (e) {
                        if (e.target.closest('#btnTutSkip')) return;
                        if (e.target.closest('#btnTutNext')) return;
                        advanceStep();
                    });
                }

                if (btnTutNext && !btnTutNext.dataset.bound) {
                    btnTutNext.dataset.bound = 'true';
                    btnTutNext.addEventListener('click', function (e) {
                        e.stopPropagation();
                        advanceStep();
                    });
                }

                if (btnTutSkip && !btnTutSkip.dataset.bound) {
                    btnTutSkip.dataset.bound = 'true';
                    btnTutSkip.addEventListener('click', function (e) {
                        e.stopPropagation();
                        end();
                    });
                }

                if (!_keyHandlerBound) {
                    _keyHandlerBound = true;
                    window.addEventListener('keydown', function (e) {
                        const overlay = document.getElementById('tutorialOverlay');
                        if (overlay && overlay.classList.contains('show')) {
                            if (e.key === 'Escape') {
                                e.preventDefault();
                                e.stopPropagation();
                                end();
                            } else if (e.key === ' ' || e.key === 'Enter') {
                                e.preventDefault();
                                e.stopPropagation();
                                advanceStep();
                            }
                        }
                    }, true);
                }
            }

            return {
                start: start,
                end: end,
                renderStep: renderStep,
                completeTypewriterImmediately: completeTypewriterImmediately,
                advanceStep: advanceStep
            };
        })();

        // ─── Keyboard Sound Effects (Web Audio API — không cần file âm thanh) ───
        window.WordleSfx = (function () {
            let _ctx = null;
            function ctx() {
                if (!_ctx) _ctx = new (window.AudioContext || window.webkitAudioContext)();
                // Resume nếu bị suspend (auto-play policy)
                if (_ctx.state === 'suspended') _ctx.resume();
                return _ctx;
            }

            // Tạo một oscillator ngắn
            function beep(freq, type, gainVal, durationSec, startTimeSec) {
                try {
                    const c = ctx();
                    const osc = c.createOscillator();
                    const gain = c.createGain();
                    osc.connect(gain);
                    gain.connect(c.destination);
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, c.currentTime + startTimeSec);
                    gain.gain.setValueAtTime(gainVal, c.currentTime + startTimeSec);
                    gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + startTimeSec + durationSec);
                    osc.start(c.currentTime + startTimeSec);
                    osc.stop(c.currentTime + startTimeSec + durationSec);
                } catch (e) { }
            }

            return {
                // Gõ một ký tự: click ngắn giống bàn phím cơ
                keyClick: function () {
                    beep(1100, 'square', 0.06, 0.055, 0);
                    beep(900, 'square', 0.03, 0.03, 0.01);
                },
                // Xóa ký tự: âm thấp hơn
                keyDelete: function () {
                    beep(600, 'triangle', 0.07, 0.07, 0);
                },
                // Enter hợp lệ (nộp đúng số chữ): hai nốt nhẹ lên
                keyEnterOk: function () {
                    beep(880, 'sine', 0.08, 0.08, 0);
                    beep(1100, 'sine', 0.06, 0.1, 0.06);
                },
                // Enter thiếu chữ hoặc lỗi: âm rè ngắn
                keyEnterError: function () {
                    beep(200, 'sawtooth', 0.1, 0.12, 0);
                },
                // Đoán đúng (win): fanfare nhỏ
                win: function () {
                    [523, 659, 784, 1047].forEach(function (f, i) {
                        beep(f, 'sine', 0.12, 0.18, i * 0.1);
                    });
                },
                // Hết lượt (lose): âm xuống dần
                lose: function () {
                    [440, 370, 294, 220].forEach(function (f, i) {
                        beep(f, 'triangle', 0.1, 0.2, i * 0.12);
                    });
                },

                // ─── Quantum Cipher (Bẻ Khóa Bom Lượng Tử) ───
                // Tiếng điện giật xè xè (Real Electric Arc Sizzle & Crackle)
                electricZap: function () {
                    try {
                        const c = ctx();
                        const now = c.currentTime;
                        // 1. Dual oscillator buzzing
                        const osc1 = c.createOscillator();
                        const osc2 = c.createOscillator();
                        const zapGain = c.createGain();
                        osc1.type = 'sawtooth';
                        osc1.frequency.setValueAtTime(160, now);
                        osc1.frequency.exponentialRampToValueAtTime(70, now + 0.38);
                        osc2.type = 'square';
                        osc2.frequency.setValueAtTime(840, now);
                        osc2.frequency.exponentialRampToValueAtTime(90, now + 0.38);
                        zapGain.gain.setValueAtTime(0.38, now);
                        zapGain.gain.exponentialRampToValueAtTime(0.01, now + 0.38);
                        osc1.connect(zapGain);
                        osc2.connect(zapGain);
                        zapGain.connect(c.destination);
                        // 2. High-frequency White Noise Crackle Bursts ("xè xè... tạch tạch")
                        const duration = 0.42;
                        const bufferSize = Math.floor(c.sampleRate * duration);
                        const noiseBuffer = c.createBuffer(1, bufferSize, c.sampleRate);
                        const output = noiseBuffer.getChannelData(0);
                        for (let i = 0; i < bufferSize; i++) {
                            const sputter = Math.random() > 0.25 ? 1 : 0.05;
                            output[i] = (Math.random() * 2 - 1) * sputter;
                        }
                        const whiteNoise = c.createBufferSource();
                        whiteNoise.buffer = noiseBuffer;
                        const bandpass = c.createBiquadFilter();
                        bandpass.type = 'bandpass';
                        bandpass.frequency.setValueAtTime(3200, now);
                        bandpass.Q.setValueAtTime(2.8, now);
                        const noiseGain = c.createGain();
                        noiseGain.gain.setValueAtTime(0.55, now);
                        noiseGain.gain.exponentialRampToValueAtTime(0.01, now + duration);
                        whiteNoise.connect(bandpass);
                        bandpass.connect(noiseGain);
                        noiseGain.connect(c.destination);
                        osc1.start(now);
                        osc2.start(now);
                        whiteNoise.start(now);
                        osc1.stop(now + 0.38);
                        osc2.stop(now + 0.38);
                        whiteNoise.stop(now + duration);
                    } catch (e) { }
                },

                // Chuông cảnh báo 30s cuối cùng (to 1 cái)
                alarm30s: function () {
                    try {
                        const c = ctx();
                        const now = c.currentTime;
                        const osc1 = c.createOscillator();
                        const osc2 = c.createOscillator();
                        const gain = c.createGain();
                        osc1.type = 'sawtooth';
                        osc1.frequency.setValueAtTime(900, now);
                        osc1.frequency.linearRampToValueAtTime(1450, now + 0.22);
                        osc1.frequency.linearRampToValueAtTime(800, now + 0.55);
                        osc2.type = 'square';
                        osc2.frequency.setValueAtTime(450, now);
                        osc2.frequency.linearRampToValueAtTime(725, now + 0.22);
                        osc2.frequency.linearRampToValueAtTime(400, now + 0.55);
                        gain.gain.setValueAtTime(0.65, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.58);
                        osc1.connect(gain);
                        osc2.connect(gain);
                        gain.connect(c.destination);
                        osc1.start(now);
                        osc2.start(now);
                        osc1.stop(now + 0.58);
                        osc2.stop(now + 0.58);
                    } catch (e) { }
                },

                // Tiếng đếm giây thông minh (bình thường >30s, nhấn mạnh 30s, nhanh dần 20s, dồn dập 10s)
                quantumTick: function (sec) {
                    try {
                        if (sec > 30) {
                            beep(620, 'sine', 0.08, 0.035, 0);
                        } else if (sec === 30) {
                            this.alarm30s();
                        } else if (sec > 20) {
                            beep(850, 'sine', 0.14, 0.04, 0);
                        } else if (sec > 10) {
                            beep(980, 'sine', 0.20, 0.035, 0);
                            setTimeout(() => { beep(1050, 'sine', 0.18, 0.035, 0); }, 500);
                        } else if (sec > 0) {
                            beep(1300, 'sine', 0.28, 0.035, 0);
                            [250, 500, 750].forEach((delay, idx) => {
                                setTimeout(() => { beep(1350 + idx * 50, 'sine', 0.24, 0.03, 0); }, delay);
                            });
                        }
                    } catch (e) { }
                },

                // ─── HSK Máy Bay Bắn Từ Vựng ───
                // Tiếng đạn laser bắn từ máy bay
                laserShoot: function () {
                    try {
                        const c = ctx();
                        const osc = c.createOscillator();
                        const gain = c.createGain();
                        osc.connect(gain);
                        gain.connect(c.destination);
                        osc.type = 'sawtooth';
                        const t = c.currentTime;
                        osc.frequency.setValueAtTime(980, t);
                        osc.frequency.exponentialRampToValueAtTime(140, t + 0.16);
                        gain.gain.setValueAtTime(0.12, t);
                        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
                        osc.start(t);
                        osc.stop(t + 0.16);
                    } catch (e) { }
                },

                // Tiếng nổ / va chạm đạn trúng từ vựng
                bulletHit: function () {
                    try {
                        const c = ctx();
                        const t = c.currentTime;
                        // 1. Âm trầm nổ boom (thump)
                        const osc = c.createOscillator();
                        const gain = c.createGain();
                        osc.connect(gain);
                        gain.connect(c.destination);
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(170, t);
                        osc.frequency.exponentialRampToValueAtTime(35, t + 0.22);
                        gain.gain.setValueAtTime(0.25, t);
                        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
                        osc.start(t);
                        osc.stop(t + 0.22);

                        // 2. Tiếng nổ va chạm vỡ vụn
                        const snap = c.createOscillator();
                        const snapGain = c.createGain();
                        snap.connect(snapGain);
                        snapGain.connect(c.destination);
                        snap.type = 'square';
                        snap.frequency.setValueAtTime(450, t);
                        snap.frequency.exponentialRampToValueAtTime(80, t + 0.12);
                        snapGain.gain.setValueAtTime(0.12, t);
                        snapGain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
                        snap.start(t);
                        snap.stop(t + 0.12);
                    } catch (e) { }
                },

                // Tiếng khi từ rơi chạm đáy gây trừ máu (Damage Hit)
                damageHit: function () {
                    try {
                        const c = ctx();
                        const t = c.currentTime;
                        // Âm cảnh báo rè thấp (alarm buzz / impact)
                        const osc = c.createOscillator();
                        const gain = c.createGain();
                        osc.connect(gain);
                        gain.connect(c.destination);
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(140, t);
                        osc.frequency.linearRampToValueAtTime(60, t + 0.28);
                        gain.gain.setValueAtTime(0.28, t);
                        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
                        osc.start(t);
                        osc.stop(t + 0.28);

                        // Tiếng đập thình thịch thứ 2
                        beep(90, 'triangle', 0.22, 0.25, 0.05);
                    } catch (e) { }
                },

                // Tiếng thưởng Combo khi bắn trúng liên tiếp
                comboSound: function (combo) {
                    try {
                        const baseFreq = Math.min(1200, 440 + (combo * 70));
                        beep(baseFreq, 'sine', 0.12, 0.15, 0);
                        beep(baseFreq * 1.25, 'triangle', 0.08, 0.18, 0.06);
                    } catch (e) { }
                },

                // Tiếng đếm ngược 3, 2, 1
                countdownTick: function (num) {
                    const freqs = { 3: 523, 2: 659, 1: 784 };
                    const f = freqs[num] || 600;
                    beep(f, 'sine', 0.15, 0.18, 0);
                    beep(f * 1.5, 'triangle', 0.05, 0.12, 0.02);
                },

                // Tiếng bắt đầu màn mới (GO!)
                countdownGo: function () {
                    [523, 659, 784, 1046].forEach(function (f, i) {
                        beep(f, 'square', 0.1, 0.22, i * 0.07);
                    });
                },

                // ─── Nhạc Nền Game (Web Audio Retro Arcade Synth BGM Loop) ───
                _bgmTimer: null,
                _bgmPlaying: false,
                _bgmStep: 0,
                startBgm: function () {
                    if (this._bgmPlaying) return;
                    this._bgmPlaying = true;
                    const self = this;
                    const melody = [
                        523, 0, 659, 0,  784, 880, 784, 0,
                        659, 0, 523, 0,  587, 0, 659, 0,
                        784, 0, 880, 0,  1046, 0, 880, 784,
                        659, 587, 523, 0, 440, 0, 523, 0
                    ];
                    const bass = [
                        261, 261, 261, 261, 220, 220, 220, 220,
                        174, 174, 174, 174, 196, 196, 196, 196,
                        261, 261, 261, 261, 220, 220, 220, 220,
                        174, 174, 174, 174, 196, 196, 246, 196
                    ];

                    this._bgmStep = 0;
                    this._bgmTimer = setInterval(function () {
                        if (!self._bgmPlaying) return;
                        const step = self._bgmStep % melody.length;
                        const note = melody[step];
                        const bNote = bass[step];
                        if (note > 0) {
                            beep(note, 'sine', 0.035, 0.16, 0);
                        }
                        if (step % 2 === 0 && bNote > 0) {
                            beep(bNote, 'triangle', 0.042, 0.2, 0);
                        }
                        self._bgmStep++;
                    }, 175);
                },

                stopBgm: function () {
                    this._bgmPlaying = false;
                    if (this._bgmTimer) {
                        clearInterval(this._bgmTimer);
                        this._bgmTimer = null;
                    }
                },

                toggleBgm: function () {
                    if (this._bgmPlaying) {
                        this.stopBgm();
                        return false;
                    } else {
                        this.startBgm();
                        return true;
                    }
                },

                isBgmPlaying: function () {
                    return this._bgmPlaying;
                }
            };
        })();

        // Auto-focus helper cho HSK Shooter
        window.focusHskInput = function () {
            try {
                const input = document.querySelector('.hsk-input-dock input');
                if (input && document.activeElement !== input) {
                    input.focus();
                }
            } catch (e) { }
        };

        // Tự động focus lại ô nhập khi click chuột ra ngoài chiến trường
        document.addEventListener('pointerdown', function (e) {
            const overlay = document.querySelector('.hsk-game-overlay');
            if (overlay && !e.target.closest('button, .hsk-dialog-card, .hsk-stage-map-card, .hsk-resume-overlay, .hsk-stage-complete-overlay, .stage-map-overlay')) {
                const input = overlay.querySelector('.hsk-input-dock input');
                if (input && document.activeElement !== input) {
                    setTimeout(() => input.focus(), 0);
                }
            }
        });

        // Drag-to-scroll cho Bản Đồ Tầng HSK Shooter (Dí chuột kéo lên kéo xuống)
        window.initStageMapDrag = function () {
            const el = document.getElementById('hskStageMapScroll');
            if (!el || el.dataset.dragInit) return;
            el.dataset.dragInit = 'true';

            let startY = 0;
            let scrollTop = 0;

            if (!window._hskMapDragWindowInit) {
                window._hskMapDragWindowInit = true;
                window.addEventListener('mouseup', function () {
                    const scrollEl = document.getElementById('hskStageMapScroll');
                    if (scrollEl) {
                        scrollEl._isDraggingMap = false;
                        scrollEl.classList.remove('is-dragging');
                    }
                });
            }

            el.addEventListener('mousedown', function (e) {
                if (e.target.closest('button, .btn-stage-play, .btn-close-map, .btn-resume-from-map')) return;
                el._isDraggingMap = true;
                el.classList.add('is-dragging');
                startY = e.pageY - el.offsetTop;
                scrollTop = el.scrollTop;
            });

            el.addEventListener('mousemove', function (e) {
                if (!el._isDraggingMap) return;
                e.preventDefault();
                const y = e.pageY - el.offsetTop;
                const walk = (y - startY) * 1.5;
                el.scrollTop = scrollTop - walk;
            });

            // Tự động cuộn căn giữa tầng đang ở
            setTimeout(function () {
                const activeRow = document.getElementById('currentActiveStageRow');
                if (activeRow) {
                    activeRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, 100);
        };
    </script>
